<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>招式對撞系統管理頁</title>
<style>
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;max-width:1200px;margin:1.5rem auto;padding:0 1.5rem;line-height:1.6;color:#222;background:#fafafa}
h1{color:#b00020;border-bottom:2px solid #eee;padding-bottom:.4rem}
h2{color:#0d47a1;margin-top:2rem;border-bottom:1px solid #eee;padding-bottom:.3rem}
.tabs{display:flex;gap:.5rem;margin:1rem 0}
.tab{padding:.5rem 1rem;border:1px solid #ccc;border-radius:6px;cursor:pointer;background:#fff}
.tab.active{background:#0d47a1;color:#fff;border-color:#0d47a1}
.panel{display:none}
.panel.active{display:block}
table{border-collapse:collapse;width:100%;margin:.8rem 0;background:#fff;font-size:.9rem}
th,td{border:1px solid #ddd;padding:.4rem .6rem;text-align:left;vertical-align:top}
th{background:#f0f4ff;position:sticky;top:0}
tr.unreviewed td{background:#fff8e1}
tr.manual td{background:#e8f5e9}
code{background:#f0f0f0;padding:.05rem .25rem;border-radius:3px}
input,textarea,button{font-family:inherit;font-size:.9rem}
textarea{width:100%;min-height:60px}
.btn{padding:.35rem .8rem;border-radius:5px;border:1px solid #ccc;cursor:pointer;background:#fff}
.btn.primary{background:#0d47a1;color:#fff;border-color:#0d47a1}
.btn.green{background:#2e7d32;color:#fff;border-color:#2e7d32}
.btn.gray{background:#eee}
.btn.danger{background:#c62828;color:#fff;border-color:#c62828}
.ctx-menu{position:fixed;z-index:100;background:#fff;border:1px solid #ccc;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:.3rem;min-width:180px}
.ctx-item{display:block;width:100%;text-align:left;border:none;background:none;padding:.45rem .6rem;border-radius:4px;cursor:pointer;font-size:.88rem}
.ctx-item:hover{background:#ffebee;color:#c62828}
tr.battle-row{cursor:context-menu}
.status{display:inline-block;padding:.15rem .5rem;border-radius:10px;font-size:.8rem}
.status.ok{background:#e8f5e9;color:#2e7d32}
.status.warn{background:#fff3e0;color:#e65100}
.status.err{background:#ffebee;color:#c62828}
#toast{position:fixed;bottom:1rem;right:1rem;background:#333;color:#fff;padding:.6rem 1rem;border-radius:6px;display:none;z-index:99}
.loading{color:#888;font-style:italic}
.hd{color:#888;font-size:.75rem}
.tag{display:inline-block;background:#e3f2fd;border:1px solid #90caf9;border-radius:10px;padding:.05rem .4rem;margin:.1rem .15rem;font-size:.8rem}
.tag-x{border:none;background:transparent;color:#0d47a1;cursor:pointer;margin-left:.15rem;font-weight:bold}
.tag-add{margin-left:.3rem}
.tag-input{width:6rem;font-size:.8rem;padding:.15rem .3rem;border:1px solid #ccc;border-radius:4px}
.tag-btn{padding:.1rem .5rem;font-size:.8rem}
.dt-bar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.6rem 0 .2rem}
.dt-search{flex:1;min-width:200px;padding:.35rem .6rem;border:1px solid #ccc;border-radius:5px}
.dt-filter{padding:.3rem .5rem;border:1px solid #ccc;border-radius:5px;max-width:200px}
.dt-count{color:#888;font-size:.8rem;white-space:nowrap}
th.dt-th{cursor:pointer;user-select:none}
th.dt-th:hover{background:#e3edff}
th.dt-th.sorted{background:#dbe6ff}
</style>
</head>
<body>
<h1>招式對撞系統管理頁</h1>

<div class="tabs">
  <div class="tab active" data-panel="panel-growth">成長審計</div>
  <div class="tab" data-panel="panel-data">資料表</div>
  <div class="tab" data-panel="panel-logs">Action Log</div>
  <div class="tab" data-panel="panel-floors">樓層</div>
  <div class="tab" data-panel="panel-sheets">Sheets 同步</div>
</div>

<div id="panel-growth" class="panel active">
  <h2>成長審計（人工審查 / 數值修正）</h2>
  <p><label>依討論串過濾：</label><input id="growth-filter" placeholder="thread_id（留空=全部）"></p>
  <table id="growth-table">
    <thead><tr>
      <th>ID</th><th>討論串</th><th>類別</th><th>目標</th><th>欄位</th>
      <th>old→new</th><th>delta</th><th>來源</th><th>原因</th><th>審查</th><th>操作</th>
    </tr></thead>
    <tbody id="growth-body"><tr><td colspan="11" class="loading">載入中…</td></tr></tbody>
  </table>
</div>

<div id="panel-data" class="panel">
  <h2>資料表查閱</h2>
  <div class="tabs" style="margin-top:0">
    <div class="tab active" data-panel="dt-char">角色</div>
    <div class="tab" data-panel="dt-ability">能力</div>
    <div class="tab" data-panel="dt-skill">招式</div>
    <div class="tab" data-panel="dt-domain">結界</div>
    <div class="tab" data-panel="dt-battle">對撞紀錄</div>
    <div class="tab" data-panel="dt-race">種族</div>
  </div>

  <div id="dt-char" class="panel active"><table id="char-table"><thead></thead><tbody></tbody></table></div>
  <div id="dt-ability" class="panel"><table id="ability-table"><thead></thead><tbody></tbody></table></div>
  <div id="dt-skill" class="panel"><table id="skill-table"><thead></thead><tbody></tbody></table></div>
  <div id="dt-domain" class="panel"><table id="domain-table"><thead></thead><tbody></tbody></table></div>
  <div id="dt-battle" class="panel"><table id="battle-table"><thead></thead><tbody></tbody></table></div>
  <div id="dt-race" class="panel"><table id="race-table"><thead></thead><tbody></tbody></table></div>
</div>

<div id="panel-logs" class="panel">
  <h2>樓層 Action Log</h2>
  <table id="action-table"><thead><tr>
    <th>ID</th><th>討論串</th><th>類型</th><th>角色</th><th>內容</th><th>關聯數值</th><th>battle_id</th><th>時間</th>
  </tr></thead><tbody id="action-body"><tr><td colspan="8" class="loading">載入中…</td></tr></tbody></table>
</div>

<div id="panel-floors" class="panel">
  <h2>樓層</h2>
  <table id="floor-table"><thead><tr>
    <th>ID</th><th>討論串</th><th>名稱</th><th>狀態</th><th>已總結</th><th>總結時間</th>
  </tr></thead><tbody id="floor-body"><tr><td colspan="6" class="loading">載入中…</td></tr></tbody></table>
</div>

<div id="panel-sheets" class="panel">
  <h2>Google Sheets 同步</h2>
  <div id="sheets-status"><span class="loading">讀取中…</span></div>
  <p><button class="btn primary" id="sheets-sync-btn">立即同步全部工作表</button></p>
  <div id="sheets-result"></div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg, ok=true){
  const t = $('#toast');
  t.textContent = msg;
  t.style.background = ok ? '#2e7d32' : '#c62828';
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 2600);
}
async function api(path, opts={}){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if(!r.ok){
    let d=''; try{ d = (await r.json()).detail || ''; }catch(e){}
    throw new Error(d || `HTTP ${r.status}`);
  }
  return r.json();
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = s => { const t = String(s ?? ''); return t.length>120 ? t.slice(0,120)+'…' : t; };

// ── tabs ──
// 每個 tab bar 只切換自己群組內的 panel（外層 tab bar 管 body 直屬 panel，
// 資料表內層 tab bar 只管 #panel-data 內部的子 panel），互不干擾。
function bindTabs(){
  document.querySelectorAll('.tabs').forEach(bar=>{
    bar.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
      bar.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      const host = bar.parentElement;
      host.querySelectorAll(':scope > .panel').forEach(p=>p.classList.remove('active'));
      const target = host.querySelector(':scope > #' + t.dataset.panel);
      if(target) target.classList.add('active');
    }));
  });
}
bindTabs();

// ── growth log ──
function renderGrowth(rows){
  const body = $('#growth-body');
  if(!rows.length){ body.innerHTML = '<tr><td colspan="11">無成長紀錄</td></tr>'; return; }
  body.innerHTML = rows.map(g=>`
    <tr class="${g.source==='manual'?'manual':(g.reviewed?'':'unreviewed')}">
      <td>${g.id}</td>
      <td>${esc(g.thread_id)}</td>
      <td>${esc(g.category)}</td>
      <td>${esc(g.target_name)}</td>
      <td>${esc(g.field)}</td>
      <td>${esc(g.old_value)} → <b>${esc(g.new_value)}</b></td>
      <td>${esc(g.delta)}</td>
      <td>${esc(g.source)}</td>
      <td>${esc(short(g.reason))}</td>
      <td>${g.reviewed ? `✅ ${esc(g.reviewed_by)}` : '<span class="status warn">未審查</span>'}</td>
      <td>
        <button class="btn green" onclick="openReview(${g.id})">審查/修正</button>
        <span style="font-size:.8rem;color:#888">event:${esc(g.floor_event_id||'')}</span>
      </td>
    </tr>`).join('');
}
async function loadGrowth(){
  const tid = $('#growth-filter').value.trim();
  try{
    const rows = await api('/api/growth' + (tid ? '?thread_id='+encodeURIComponent(tid) : ''));
    renderGrowth(rows);
  }catch(e){ $('#growth-body').innerHTML = `<tr><td colspan="11">載入失敗：${esc(e.message)}</td></tr>`; }
}
$('#growth-filter').addEventListener('input', ()=>{ clearTimeout(window._gf); window._gf = setTimeout(loadGrowth, 300); });

let currentReviewId = null;
function openReview(id){ currentReviewId = id; $('#review-dialog').showModal(); }
function closeReview(){ $('#review-dialog').close(); }
async function submitReview(){
  const val = $('#review-new').value.trim();
  const note = $('#review-note').value.trim();
  try{
    const r = await api(`/api/growth/${currentReviewId}/review`, {
      method:'POST', body: JSON.stringify({reviewed_by:'admin', approved:!val, new_value: val || null, note})
    });
    toast(r.correction ? `已修正 → ${r.correction.new_value}（新 log #${r.correction.id}）` : '已標記審查');
    closeReview(); $('#review-new').value=''; $('#review-note').value='';
    loadGrowth();
  }catch(e){ toast(e.message, false); }
}

// ── Excel 風資料表控制器：點表頭排序、關鍵字搜尋、欄位篩選 ──
// config = { columns:[{key,label,filter?,cell?}], renderRow(row,idx), appendHTML? }
// 回傳 { setRows, render }。cell(row) 可自訂搜尋/排序/篩選用的文字。
function makeDataTable(sel, config){
  const tbl = $(sel);
  const state = { sortKey:null, sortDir:1, query:'', filters:{}, rows:[] };
  const byKey = k => config.columns.find(c=>c.key===k);

  const bar = document.createElement('div');
  bar.className = 'dt-bar';
  const search = document.createElement('input');
  search.className = 'dt-search';
  search.placeholder = '搜尋全部欄位…';
  const count = document.createElement('span');
  count.className = 'dt-count';
  const clearBtn = document.createElement('button');
  clearBtn.className = 'btn gray';
  clearBtn.textContent = '✕ 清除';
  clearBtn.style.display = 'none';
  bar.appendChild(search);
  config.columns.forEach(col=>{
    if(!col.filter) return;
    const f = document.createElement('select');
    f.className = 'dt-filter';
    f.dataset.col = col.key;
    f.appendChild(opt('', `${col.label}：全部`));
    bar.appendChild(f);
    f.addEventListener('change', ()=>{
      state.filters[col.key] = f.value;
      refreshBar(); render();
    });
  });
  bar.appendChild(clearBtn);
  bar.appendChild(count);
  tbl.before(bar);

  function opt(v,label){ const o=document.createElement('option'); o.value=v; o.textContent=label; return o; }
  function hasFilter(){ if(state.query) return true; return Object.keys(state.filters).some(k=>state.filters[k]); }
  function refreshBar(){ clearBtn.style.display = hasFilter() ? 'inline-block' : 'none'; }
  clearBtn.addEventListener('click', ()=>{
    state.query=''; state.filters={}; state.sortKey=null; state.sortDir=1;
    search.value='';
    bar.querySelectorAll('.dt-filter').forEach(s=>s.value='');
    refreshBar(); render();
  });
  search.addEventListener('input', ()=>{
    state.query = search.value.trim().toLowerCase();
    refreshBar(); render();
  });

  function cellText(row, col){
    if(col.cell) return String(col.cell(row) ?? '');
    let v = row[col.key];
    if(v===null||v===undefined) return '';
    if(typeof v==='object') v = JSON.stringify(v);
    return String(v);
  }
  function keep(row){
    if(state.query){
      const hay = config.columns.map(c=>cellText(row,c).toLowerCase()).join('\n');
      if(!hay.includes(state.query)) return false;
    }
    for(const k in state.filters){
      if(state.filters[k] && cellText(row, byKey(k)) !== state.filters[k]) return false;
    }
    return true;
  }
  function compare(a,b){
    if(!state.sortKey) return 0;
    const col = byKey(state.sortKey);
    const av = cellText(a.row,col), bv = cellText(b.row,col);
    const na = parseFloat(av), nb = parseFloat(bv);
    let c;
    if(av.trim()!=='' && bv.trim()!=='' && !isNaN(na) && !isNaN(nb)) c = na - nb;
    else c = av.localeCompare(bv, 'zh-Hant');
    return c * state.sortDir;
  }
  function visible(){
    const items = [];
    state.rows.forEach((row,idx)=>{ if(keep(row)) items.push({row,idx}); });
    if(state.sortKey) items.sort(compare);
    return items;
  }
  function render(){
    const sorted = state.sortKey;
    tbl.querySelector('thead').innerHTML = '<tr>' + config.columns.map(c=>{
      const on = sorted===c.key;
      const arrow = on ? (state.sortDir>0?' ▲':' ▼') : '';
      return `<th class="dt-th${on?' sorted':''}" data-col="${esc(c.key)}">${esc(c.label)}${arrow}</th>`;
    }).join('') + '</tr>';
    const items = visible();
    count.textContent = `${items.length} / ${state.rows.length} 筆`;
    const tbody = tbl.querySelector('tbody');
    if(!items.length){
      tbody.innerHTML = `<tr><td colspan="${config.columns.length}">無資料</td></tr>`;
      return;
    }
    tbody.innerHTML = items.map(it=>config.renderRow(it.row, it.idx)).join('');
    if(config.appendHTML && !hasFilter() && items.length){
      tbody.innerHTML += typeof config.appendHTML==='function' ? config.appendHTML() : config.appendHTML;
    }
  }
  tbl.querySelector('thead').addEventListener('click', e=>{
    const th = e.target.closest('th[data-col]');
    if(!th) return;
    const key = th.dataset.col;
    if(state.sortKey===key) state.sortDir = -state.sortDir;
    else { state.sortKey = key; state.sortDir = 1; }
    render();
  });
  function setRows(data){
    state.rows = data;
    config.columns.forEach(col=>{
      const f = bar.querySelector(`.dt-filter[data-col="${CSS.escape(col.key)}"]`);
      if(!f) return;
      const cur = f.value;
      const vals = [...new Set(data.map(r=>cellText(r,col)).filter(v=>v!==''))]
        .sort((a,b)=>a.localeCompare(b,'zh-Hant'));
      f.innerHTML = '';
      f.appendChild(opt('', `${col.label}：全部`));
      vals.forEach(v=>{ const o=opt(v, v.length>24 ? v.slice(0,24)+'…' : v); o.title=v; f.appendChild(o); });
      f.value = cur;
    });
    render();
  }
  return { setRows, render, state, config };
}

// ── 角色表（含隱藏分顯示 + 特殊標籤編輯）──
const STAT_KEYS = ['力量','敏捷','智力','體質','魅力','幸運'];
let RACE_KEYS = STAT_KEYS;
let charRows = [];
function safeJson(s, fallback){
  if(typeof s === 'object' && s !== null) return s;
  if(typeof s === 'string' && s.trim()){ try{ return JSON.parse(s); }catch(e){} }
  return fallback;
}
const charDT = makeDataTable('#char-table', {
  columns: [
    {key:'name', label:'名稱', filter:true},
    {key:'race', label:'種族', filter:true},
    {key:'school_rank', label:'學校評級', filter:true},
    {key:'stats', label:'六維（評級／隱藏分）', cell:c=>Object.entries(safeJson(c.stats,{})).map(([k,v])=>`${k}${v}`).join(' ')},
    {key:'special_tags', label:'特殊標籤', cell:c=>safeJson(c.special_tags,[]).join('、')},
    {key:'special_forms', label:'特殊型態', cell:c=>Object.keys(safeJson(c.special_forms,{})).join('、')},
    {key:'weapon', label:'武器'},
    {key:'max_mp', label:'MP'},
    {key:'martial', label:'武藝'},
    {key:'exp', label:'經驗'},
  ],
  renderRow: (c, ridx)=>{
    const stats = safeJson(c.stats, {});
    const forms = safeJson(c.special_forms, {});
    const tags = safeJson(c.special_tags, []);
    const h = c.hidden || {};
    const statCell = STAT_KEYS.map(s=>{
      const r = stats[s] || '?';
      const hv = h[s];
      return `<div>${s} <b>${esc(r)}</b>${hv!=null?` <span class="hd">${hv}</span>`:''}</div>`;
    }).join('');
    const tagCell = tags.map((t,ti)=>`<span class="tag">${esc(t)}<button class="tag-x" data-id="${ridx}" data-tidx="${ti}" title="移除">×</button></span>`).join(' ') +
      `<span class="tag-add"><input class="tag-input" placeholder="新標籤"><button class="btn tag-btn" data-addtag="${ridx}">＋</button></span>`;
    const formCell = Object.entries(forms).map(([k,v])=>`
      <span class="tag">${esc(k)}×${v}<button class="tag-x sf-x" data-id="${ridx}" data-sfname="${esc(k)}" title="移除">×</button></span>
    `).join(' ') +
      `<span class="tag-add"><input class="tag-input sf-name" placeholder="型態名"><input class="tag-input sf-mult" placeholder="倍率 1.1~1.5" style="width:5rem"><button class="btn tag-btn" data-addform="${ridx}">＋</button></span>`;
    const badges = [
      c.is_teacher ? '教師' : '',
      c.is_villain ? '反派' : '',
      c.dynamic_difficulty ? '動態難度' : '',
    ].filter(Boolean).map(b=>`<span class="status warn">${b}</span>`).join(' ');
    return `<tr>
      <td><b>${esc(c.name)}</b> ${badges}</td>
      <td>${esc(c.race)}</td>
      <td>${esc(c.school_rank)}</td>
      <td>${statCell}</td>
      <td>${tagCell}</td>
      <td>${formCell || '—'}</td>
      <td>${esc(c.weapon)}</td>
      <td>${c.max_mp}</td>
      <td>${c.martial}</td>
      <td>${c.exp}</td>
    </tr>`;
  },
});
function renderCharacters(chars){ charRows = chars; charDT.setRows(chars); }
$('#char-table').addEventListener('click', e=>{
  const delBtn = e.target.closest('.tag-x');
  if(delBtn){
    const row = charRows[+delBtn.dataset.id];
    if(delBtn.classList.contains('sf-x')){
      const form = delBtn.dataset.sfname;
      api('/api/characters/'+encodeURIComponent(row.name)+'/special_forms', {
        method:'POST', body: JSON.stringify({form, action:'remove'})
      }).then(()=>{ toast(`已移除型態「${form}」`); loadDataTables(); })
        .catch(err=>toast(err.message, false));
    }else{
      const tag = safeJson(row.special_tags, [])[+delBtn.dataset.tidx];
      api('/api/characters/'+encodeURIComponent(row.name)+'/tags', {
        method:'POST', body: JSON.stringify({tag, action:'remove'})
      }).then(()=>{ toast(`已移除標籤「${tag}」`); loadDataTables(); })
        .catch(err=>toast(err.message, false));
    }
    return;
  }
  const addBtn = e.target.closest('[data-addtag]');
  if(addBtn){
    const row = charRows[+addBtn.dataset.addtag];
    const input = addBtn.closest('td').querySelector('.tag-input');
    const tag = (input.value || '').trim();
    if(!tag){ toast('請輸入標籤名稱', false); return; }
    api('/api/characters/'+encodeURIComponent(row.name)+'/tags', {
      method:'POST', body: JSON.stringify({tag, action:'add'})
    }).then(()=>{ toast(`已新增標籤「${tag}」`); loadDataTables(); })
      .catch(err=>toast(err.message, false));
  }
  const addForm = e.target.closest('[data-addform]');
  if(addForm){
    const row = charRows[+addForm.dataset.addform];
    const td = addForm.closest('td');
    const name = (td.querySelector('.sf-name').value || '').trim();
    const mult = parseFloat(td.querySelector('.sf-mult').value);
    if(!name){ toast('請輸入型態名稱', false); return; }
    if(!mult || isNaN(mult)){ toast('請輸入倍率（1.1~1.5）', false); return; }
    api('/api/characters/'+encodeURIComponent(row.name)+'/special_forms', {
      method:'POST', body: JSON.stringify({form:name, multiplier:mult, action:'add'})
    }).then(()=>{ toast(`已新增型態「${name}×${mult}」`); loadDataTables(); })
      .catch(err=>toast(err.message, false));
  }
});
// ── 招式表（可編輯）──
let skillRows = [];
const skillDT = makeDataTable('#skill-table', {
  columns: [
    {key:'name', label:'招式', filter:true},
    {key:'ability', label:'所屬能力', filter:true},
    {key:'owner', label:'擁有者', filter:true},
    {key:'application', label:'應用'},
    {key:'skill_type', label:'型別', filter:true},
    {key:'magic_system', label:'體系', filter:true},
    {key:'element', label:'元素', filter:true},
    {key:'mp_cost', label:'MP'},
    {key:'power_base', label:'威力'},
    {key:'range', label:'射程'},
    {key:'effect', label:'效果'},
    {key:'op', label:'操作', cell:()=>''},

function raceColumns(keys){
  return [
    {key:'race', label:'種族', filter:true},
    ...keys.map(k=>({key:'mod_'+k, label:k, cell:r=>(r.mods||{})[k] ?? 1.0})),
    {key:'status', label:'狀態', filter:true, cell:r=>r.pending_review?'待審查':'已定案'},
    {key:'op', label:'操作', cell:()=>''},
  ];
}
const raceDT = makeDataTable('#race-table', {
  columns: raceColumns(STAT_KEYS),
  renderRow: (r)=>{
    return `<tr data-race="${esc(r.race)}">
      <td><b>${esc(r.race)}</b></td>
      ${RACE_KEYS.map(k=>`<td><input class="race-mod" data-race="${esc(r.race)}" data-stat="${k}" type="number" step="0.1" min="0.8" max="1.5" value="${(r.mods||{})[k] ?? 1.0}"></td>`).join('')}
      <td>${r.pending_review ? '<span class="status warn">待審查</span>' : '<span class="status ok">已定案</span>'}</td>
      <td>
        <button class="btn green" data-saverace="${esc(r.race)}">儲存</button>
        <button class="btn danger" data-delrace="${esc(r.race)}">刪除</button>
      </td>
    </tr>`;
  },
  appendHTML: ()=>`
    <tr>
      <td><input class="tag-input race-name" placeholder="新種族名"></td>
      ${RACE_KEYS.map(k=>`<td><input class="race-mod-new" data-stat="${k}" type="number" step="0.1" min="0.8" max="1.5" value="1.0"></td>`).join('')}
      <td></td>
      <td><button class="btn primary" data-addrace="1">新增</button></td>
    </tr>`,
});
function raceModsFromRow(race){
  const mods = {};
  document.querySelectorAll('#race-table .race-mod').forEach(inp=>{
    if(inp.dataset.race === race) mods[inp.dataset.stat] = inp.value;
  });
  return mods;
}
$('#race-table').addEventListener('click', e=>{
  const save = e.target.closest('[data-saverace]');
  if(save){
    const race = save.dataset.saverace;
    api('/api/races/'+encodeURIComponent(race), {method:'PUT', body: JSON.stringify({mods: raceModsFromRow(race)})})
      .then(()=>{ toast(`已儲存種族「${race}」`); loadDataTables(); })
      .catch(err=>toast(err.message, false));
    return;
  }
  const del = e.target.closest('[data-delrace]');
  if(del){
    const race = del.dataset.delrace;
    if(!confirm(`確定要刪除種族「${race}」？\n（使用此種族的角色會改以 1.0 計算）`)) return;
    api('/api/races/'+encodeURIComponent(race), {method:'DELETE'})
      .then(()=>{ toast(`已刪除種族「${race}」`); loadDataTables(); })
      .catch(err=>toast(err.message, false));
    return;
  }
  const add = e.target.closest('[data-addrace]');
  if(add){
    const name = (document.querySelector('.race-name').value || '').trim();
    if(!name){ toast('請輸入種族名', false); return; }
    const mods = {};
    document.querySelectorAll('.race-mod-new').forEach(inp=>{ mods[inp.dataset.stat] = inp.value; });
    api('/api/races/'+encodeURIComponent(name), {method:'PUT', body: JSON.stringify({mods})})
      .then(()=>{ toast(`已新增種族「${name}」`); loadDataTables(); })
      .catch(err=>toast(err.message, false));
  }
});
